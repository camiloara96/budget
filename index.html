      body: field("Name", '<input name="name" required value="' + esc(w.name) + '">') +
            field("Price", '<input name="cost" inputmode="decimal" value="' + (w.cost || "") + '">') + catField(w.cat) +
            field("Buy by (optional, sets a weekly amount)", '<input name="target" type="month" value="' + esc(w.target) + '">') +
            field("Already saved", '<input name="saved" inputmode="decimal" value="' + (w.saved || "") + '">') +
            (groups().upcoming.length ? field("Buying it now?", '<select name="move"><option value="">Not yet, keep it on the list</option>' +
              groups().upcoming.map(p => '<option value="' + p.id + '">Put it on the ' + dayLabel(p.date) + ' check</option>').join("") + '</select>') : ""),
      onSave: fd => {
        w.name = String(fd.get("name") || "").trim() || w.name;
        w.cost = toNum(fd.get("cost")); w.saved = toNum(fd.get("saved")); w.cat = catFrom(fd, w.cat);
        w.target = String(fd.get("target") || "");
        w.kind = w.target ? "big" : "small";
        const to = fd.get("move") && findPc(fd.get("move"));
        if (to){
          state.wishlist = state.wishlist.filter(x => x !== w);
          to.items.push({id: uid(), name: w.name, amount: Math.max(0, w.cost - w.saved), paid: false, due: "", cat: w.cat || ""});
          setTimeout(() => setStatus("Put on " + dayLabel(to.date)), 600);
        }
      },
      onDelete: () => { state.wishlist = state.wishlist.filter(x => x.id !== id); }
    });
  }

  // ---------- app helpers ----------
  function lsGet(k){ try { return localStorage.getItem("fb-" + k); } catch(e){ return null; } }
  function lsSet(k, v){ try { localStorage.setItem("fb-" + k, v); } catch(e){} }
  function isStandalone(){ return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }
  function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
  function importSheet(){
    openSheet({
      title: "Paste your data",
      body: '<p class="hint" style="margin:0 0 10px">Paste a backup, or the data from the Claude version. It replaces everything in the budget, for both of you.</p>' +
        '<label class="field"><span>Data</span><textarea name="data" rows="8" required autocapitalize="off" spellcheck="false"></textarea></label>',
      onSave: fd => {
        let d = null;
        try { d = JSON.parse(String(fd.get("data") || "").trim()); } catch(e){}
        if (!d || typeof d !== "object" || !Array.isArray(d.paychecks)){ setStatus("That text isn't budget data"); return false; }
        state = normalize(d);
        setTimeout(() => setStatus("Budget imported"), 700);
      }
    });
  }
  async function backup(){
    const name = "family-budget-" + iso(today()) + ".json";
    const text = JSON.stringify(state, null, 1);
    try {
      const file = new File([text], name, {type: "application/json"});
      if (navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: "Budget backup"}); return; }
    } catch(e){ if (e && e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], {type: "application/json"})); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  // ---------- events ----------
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id, pcId = b.dataset.pc;
    if (act === "tab"){ tab = b.dataset.tab; render(); window.scrollTo({top: 0}); return; }
    if (readOnly && act !== "tab") { setStatus("View only"); }
    if (act === "toggle"){ const pc = findPc(pcId); const it = pc && pc.items.find(i => i.id === id); if (it){ it.paid = !it.paid; syncRec(it); commit(); } }
    else if (act === "recToggle"){
      const r = recById(id); if (!r) return;
      if (isPaidNow(r)){
        const k = r.paidThrough;
        linkedAll(r, k).forEach(l => { l.it.paid = false; });
        const pv = prevOcc(r, k); r.paidThrough = pv >= r.since ? pv : "";
      } else {
        const o = openOcc(r); r.paidThrough = o;
        linkedAll(r, o).forEach(l => { l.it.paid = true; });
      }
      commit(); setStatus(r.paidThrough ? paidLabel(r) : "Marked unpaid");
    }
    else if (act === "editRec") editRec(id);
    else if (act === "recAssign"){
      const sel = document.querySelector('select[data-sel="' + id + '"]');
      const to = sel && findPc(sel.value), r = recById(id);
      if (to && r){
        const o = openOcc(r);
        to.items.push({id: uid(), name: r.name, amount: r.amount, paid: false, due: noDay(r) ? "" : o, recId: r.id, recFor: o, cat: r.cat || ""});
        commit(); setStatus("Put on " + dayLabel(to.date));
      }
    }
    else if (act === "sugg"){
      const pc = findPc(pcId); if (!pc) return;
      const kind = b.dataset.kind;
      if (kind !== "usual" || CAT_MAP[b.dataset.cat]) closeSheet();
      if (kind === "rec"){ const r = recById(id); if (r){ const o = openOcc(r); pc.items.push({id: uid(), name: r.name, amount: r.amount, paid: false, due: noDay(r) ? "" : o, recId: r.id, recFor: o, cat: r.cat || ""}); } }
      else if (kind === "pay"){ const it = state.payments.find(i => i.id === id); if (it){ state.payments = state.payments.filter(i => i !== it); it.paid = false; pc.items.push(it); } }
      else if (kind === "buy"){ const w = state.wishlist.find(x => x.id === id); if (w){ state.wishlist = state.wishlist.filter(x => x !== w); pc.items.push({id: uid(), name: w.name, amount: Math.max(0, w.cost - w.saved), paid: false, due: "", cat: w.cat || ""}); } }
      else if (kind === "usual"){
        const amt = toNum(b.dataset.amt), add = cat => { pc.items.push({id: uid(), name: id, amount: amt, paid: false, due: "", cat}); commit(); setStatus("Added to " + dayLabel(pc.date)); };
        if (CAT_MAP[b.dataset.cat]) add(b.dataset.cat); else askCategory(id, amt, catGuess(id), add);
        return;
      }
      commit(); setStatus("Added to " + dayLabel(pc.date));
    }
    else if (act === "xPay"){
      const idx = state.payments.findIndex(i => i.id === id); if (idx < 0) return;
      const it = state.payments[idx]; state.payments.splice(idx, 1); commit();
      toast("Erased " + it.name, () => state.payments.splice(Math.min(idx, state.payments.length), 0, it));
    }
    else if (act === "xWish"){
      const idx = state.wishlist.findIndex(w => w.id === id); if (idx < 0) return;
      const w = state.wishlist[idx]; state.wishlist.splice(idx, 1); commit();
      toast("Erased " + w.name, () => state.wishlist.splice(Math.min(idx, state.wishlist.length), 0, w));
    }
    else if (act === "wishAssign"){
      const sel = document.querySelector('select[data-sel="' + id + '"]');
      const to = sel && findPc(sel.value), w = state.wishlist.find(x => x.id === id);
      if (to && w){
        state.wishlist = state.wishlist.filter(x => x !== w);
        to.items.push({id: uid(), name: w.name, amount: Math.max(0, w.cost - w.saved), paid: false, due: "", cat: w.cat || ""});
        commit(); setStatus("Put on " + dayLabel(to.date));
      }
    }
    else if (act === "editItem") editItem(pcId, id);
    else if (act === "editPc") editPc(id);
    else if (act === "newPc") newPc();
    else if (act === "pickCat"){ const fn = catPending; closeSheet(); if (fn) fn(b.dataset.cat); }
    else if (act === "catName"){ const nm = b.dataset.name; askCategory(nm, 0, catGuess(nm), cat => { setCatForName(nm, cat); commit(); }); }
    else if (act === "anaRange"){ anaRange = b.dataset.r; lsSet("ana-range", anaRange); anaPt = -1; anaSlice = ""; render(); }
    else if (act === "anaPt"){ const i = Number(b.dataset.i); anaPt = anaPt === i ? -1 : i; render(); }
    else if (act === "anaSplit"){ anaSplit = b.dataset.v === "1"; lsSet("ana-split", anaSplit ? "1" : "0"); anaFocus = ""; render(); }
    else if (act === "anaFocus"){ anaFocus = b.dataset.cat === anaFocus ? "" : (b.dataset.cat || ""); render(); }
    else if (act === "anaSlice"){ anaSlice = anaSlice === b.dataset.cat ? "" : (b.dataset.cat || ""); render(); }
    else if (act === "settings"){ tab = "set"; render(); }
    else if (act === "newItem") newItemSheet(pcId);
    else if (act === "setMember") settingsMember();
    else if (act === "setPay") settingsPay();
    else if (act === "setBills") settingsBills();
    else if (act === "setNotif") settingsNotif();
    else if (act === "memberSoon"){
      const line = b.closest(".btn-line");
      if (line && !(line.nextElementSibling && line.nextElementSibling.classList.contains("soon"))) line.insertAdjacentHTML("afterend", '<p class="hint soon" style="margin:0 0 10px">Payments aren&#39;t connected yet, so this doesn&#39;t do anything for now.</p>');
    }
    else if (act === "importData"){ closeSheet(); importSheet(); }
    else if (act === "backup") backup();
    else if (act === "signout"){ closeSheet(); signOut(auth).catch(() => {}); }
    else if (act === "installDismiss"){ lsSet("install-dismissed", "1"); render(); }
    else if (act === "editPay") editPay(id);
    else if (act === "assign"){
      const sel = document.querySelector('select[data-sel="' + id + '"]');
      const to = sel && findPc(sel.value);
      const it = state.payments.find(i => i.id === id);
      if (to && it){ state.payments = state.payments.filter(i => i !== it); it.paid = false; to.items.push(it); commit(); setStatus("Moved to " + dayLabel(to.date)); }
    }
    else if (act === "editWish") editWish(id);
    else if (act === "fundGoals"){
      const next = groups().upcoming[0];
      const amt = Math.ceil(state.wishlist.filter(w => !w.done).reduce((a, w) => a + wishPerCheck(w), 0));
      if (next && amt > 0){
        const existing = next.items.find(i => i.name === "Save for big stuff");
        if (existing) existing.amount = amt; else next.items.push({id: uid(), name: "Save for big stuff", amount: amt, paid: false, due: "", cat: "savings"});
        tab = "pay"; commit(); window.scrollTo({top: 0});
      }
    }
  });
  // remember which categories are open on the analysis page across redraws
  document.addEventListener("toggle", e => { const d = e.target; if (d && d.classList && d.classList.contains("cat-row")){ if (d.open) anaOpen.add(d.dataset.cat); else anaOpen.delete(d.dataset.cat); } }, true);
  const isAddName = el => el && el.matches && el.matches('form[data-form="addItem"] input[name="name"]');
  document.addEventListener("focusin", e => { if (isAddName(e.target)) renderSugg(e.target.form); });
  document.addEventListener("input", e => { if (isAddName(e.target)) renderSugg(e.target.form); });
  document.addEventListener("focusout", e => {
    if (!isAddName(e.target)) return;
    const f = e.target.form;
    setTimeout(() => { const box = f && f.nextElementSibling; if (box && box.classList.contains("sugg") && !f.contains(document.activeElement)) box.hidden = true; }, 250);
  });
  document.addEventListener("pointerdown", e => { if (e.target.closest && e.target.closest(".sugg button")) e.preventDefault(); });
  document.addEventListener("submit", e => {
    const f = e.target.closest("form[data-form]"); if (!f) return;
    e.preventDefault();
    const fd = new FormData(f);
    const name = String(fd.get("name") || "").trim(); if (!name) return;
    const kind = f.dataset.form;
    if (kind === "addItem" && name.toLowerCase() === "extra"){ f.reset(); setStatus("Extra is calculated for you"); return; }
    let add = null, amt = 0;
    if (kind === "addItem"){ const pc = findPc(f.dataset.id); if (!pc) return; amt = toNum(fd.get("amount")); add = cat => pc.items.push({id: uid(), name, amount: amt, paid: false, due: "", cat}); }
    else if (kind === "addPay"){ amt = toNum(fd.get("amount")); const due = String(fd.get("due") || ""); add = cat => state.payments.push({id: uid(), name, amount: amt, paid: false, due, cat}); }
    else if (kind === "addRec"){
      const freq = FREQS.includes(f.dataset.freq) ? f.dataset.freq : "monthly", t = iso(today());
      const r = {id: uid(), name, amount: toNum(fd.get("amount")), freq, day: 0, anchor: "", since: t, paidThrough: "",
        auto: state.settings.autoNew === "all" || (state.settings.autoNew === "short" && (freq === "weekly" || freq === "biweekly")), autoWeek: "", skip: []};
      if (freq === "monthly") r.day = Math.max(0, Math.min(31, Math.round(toNum(fd.get("day")))));
      else r.anchor = String(fd.get("due") || "") || t;
      amt = r.amount;
      add = cat => { r.cat = cat; state.recurring.push(r); autoFill(); };
    }
    else if (kind === "addWish"){ amt = toNum(fd.get("cost")); add = cat => state.wishlist.push({id: uid(), name, cost: amt, kind: "small", target: "", saved: 0, done: false, cat}); }
    if (!add) return;
    const sel = 'form[data-form="' + kind + '"]' + (f.dataset.id ? '[data-id="' + f.dataset.id + '"]' : "") + (f.dataset.freq ? '[data-freq="' + f.dataset.freq + '"]' : "") + ' input[name="name"]';
    askCategory(name, amt, catGuess(name), cat => {
      add(cat); commit();
      const again = document.querySelector(sel);
      if (again) again.focus({preventScroll: true});
    });
  });

  // ---------- startup: sign in, then follow the shared budget live ----------
  let auth = null, currentEmail = "", currentUid = "";
  render();
  if (!firebaseConfig || !firebaseConfig.apiKey){
    $("#panePay").innerHTML = '<p class="empty">Almost ready: the app isn\'t connected to Firebase yet.</p>';
    return;
  }
  const fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp);
  let fsdb;
  try { fsdb = initializeFirestore(fbApp, {localCache: persistentLocalCache()}); } catch(e){ fsdb = getFirestore(fbApp); }
  const login = $("#login"), loginForm = $("#loginForm"), loginErr = $("#loginErr"), loginBtn = $("#loginBtn");
  const authMsg = code => ({
    "auth/invalid-credential": "Wrong email or password.", "auth/wrong-password": "Wrong email or password.",
    "auth/user-not-found": "Wrong email or password.", "auth/invalid-email": "That email doesn't look right.",
    "auth/missing-password": "Type your password.", "auth/too-many-requests": "Too many tries. Wait a few minutes or reset your password.",
    "auth/network-request-failed": "No connection. Check your internet and try again.", "auth/user-disabled": "This account is turned off."
  }[code] || "Couldn't sign in. Try again.");
  loginForm.addEventListener("submit", async e => {
    e.preventDefault();
    const email = loginForm.email.value.trim(), pw = loginForm.password.value;
    if (!email){ loginErr.textContent = "Type your email."; return; }
    loginErr.textContent = ""; loginBtn.disabled = true; loginBtn.textContent = "Signing in…";
    try { await signInWithEmailAndPassword(auth, email, pw); loginForm.password.value = ""; }
    catch(err){ loginErr.textContent = authMsg(err && err.code); }
    loginBtn.disabled = false; loginBtn.textContent = "Sign in";
  });
  $("#forgot").addEventListener("click", async () => {
    const email = loginForm.email.value.trim();
    if (!email){ loginErr.textContent = "Type your email first, then tap Forgot password."; return; }
    try { await sendPasswordResetEmail(auth, email); loginErr.textContent = "If that email has an account, a reset link is on its way."; }
    catch(err){ loginErr.textContent = authMsg(err && err.code); }
  });

  let unsub = null;
  onAuthStateChanged(auth, user => {
    if (unsub){ unsub(); unsub = null; }
    clearTimeout(saveTimer); saveTimer = null;
    if (!user){
      docRef = null; ready = false; currentEmail = ""; currentUid = "";
      state = normalize(null);
      login.hidden = false; render();
      return;
    }
    login.hidden = true; currentEmail = user.email || ""; currentUid = user.uid || "";
    readOnly = false;
    const ref = doc(fsdb, "budgets", "family");
    docRef = {set: body => setDoc(ref, body)};
    unsub = onSnapshot(ref, snap => {
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      if (saveTimer || inflight) return;           // don't clobber edits in progress
      state = normalize(snap.exists() ? snap.data() : null);
      ready = true;
      render();
      if (!readOnly){ const a = autoFill(), b = ensureMe(), c = fillCats(); if (a || b || c) commit(); }
    }, err => {
      if (err && err.code === "permission-denied"){
        ready = false; render();
        $("#panePay").innerHTML = '<p class="empty">This account can\'t open the budget. Check the Firestore rules, then sign out and back in.</p>';
      } else setStatus("Can't reach the budget. Check your connection");
    });
  });
})();
</script>
</body>
</html>
