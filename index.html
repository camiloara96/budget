<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Family Budget</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --surface:#1C1C1E; --ink:#F5F5F7; --muted:#8E8E93; --line:#2C2C2E; --dim:#636366; --raise:#3A3A3C;
  --soft:#2C2C2E; --check:#30C77B; --check-ink:#000000; --good:#30D158; --bad:#FF453A;
  --accent:#F5F5F7; --accent-ink:#000000; --banner:#2B2508; --banner-ink:#FFE27A; --red-bg:#3B1411; --red-ink:#FF9C8F; --extra-bg:#2B2508; --extra-ink:#FFD60A; --plan:#22533C; --xbar:#FFD60A;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--check);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)}
.wrap{max-width:560px;margin:0 auto;padding:4px 16px 96px}

.top{display:flex;align-items:baseline;justify-content:space-between;padding:8px 2px 4px}
.top h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-0.02em}
.status{font-size:13px;color:var(--muted)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:600;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.count{font-size:12px;font-weight:700;background:var(--check);color:var(--check-ink);border-radius:999px;padding:1px 7px;min-width:20px}

.banner{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:0;background:var(--banner);color:var(--banner-ink);border-radius:14px;padding:12px 14px;margin:2px 0 14px;font-size:15px}
.banner-cta{font-weight:700;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}

.pc{background:var(--surface);border-radius:18px;padding:16px 16px 10px;margin-bottom:14px;border:1px solid var(--line)}
.pc-head{display:flex;width:100%;align-items:baseline;justify-content:space-between;border:0;background:none;padding:0;text-align:left}
.pc-date{font-size:24px;font-weight:800;letter-spacing:-0.01em}
.pc-amt{font-size:20px;font-weight:700}
.pc-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 8px;margin:12px 0 10px}
.pc-stats .k{display:block;font-size:12px;color:var(--muted)}
.pc-stats .v{display:block;font-size:17px;font-weight:700}
.pc-stats .lead .v{font-size:22px}
.bar{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin-bottom:6px}
.bar span{display:block;height:100%;background:var(--check);border-radius:999px;transition:width .25s ease}

.items{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.chk{flex:none;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0;margin-left:-8px}
.chk::before{content:"";grid-area:1/1;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);opacity:.6}
.chk svg{grid-area:1/1;width:16px;height:16px;fill:none;stroke:var(--check-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.is-paid .chk::before{background:var(--check);border-color:var(--check);opacity:1}
.is-paid .chk svg{opacity:1}
.item-main{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:none;padding:11px 0;text-align:left}
.item-name{min-width:0;overflow-wrap:anywhere}
.is-paid .item-name{color:var(--muted)}
.due{display:block;font-size:12.5px;color:var(--muted)}
.due.bad{color:var(--bad);font-weight:600}
.amt-col{text-align:right;flex:none}
.amt-col .num{display:block;font-weight:600}
.pw{display:block;font-size:12.5px;color:var(--good);font-weight:600}

.add{display:flex;gap:8px;padding:10px 0 6px;border-top:1px dashed var(--line);margin-top:2px}
.add input,.add select{min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:16px}
.add input[name="name"]{flex:1}
.add input[name="amount"],.add input[name="cost"]{width:84px}
.add input[type="date"]{width:132px}
.add button{flex:none;border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 14px;font-weight:700}
.add-wrap{flex-wrap:wrap}

.btn-wide{width:100%;border:1.5px dashed var(--muted);background:transparent;border-radius:16px;padding:14px;font-weight:700;color:var(--ink);margin-bottom:22px}
.sect{font-size:15px;font-weight:700;color:var(--muted);margin:8px 2px 10px}

details.pc{padding:0}
details.pc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer}
details.pc summary::-webkit-details-marker{display:none}
details.pc summary .d{font-weight:700}
details.pc summary .s{font-size:14px;color:var(--muted)}
details.pc .items,details.pc .old-foot{padding:0 16px 8px}
.old-foot{font-size:13px}
.linkbtn{border:0;background:none;padding:6px 0;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.big{font-size:34px;font-weight:800;letter-spacing:-0.02em;line-height:1.1}
.summary p{margin:4px 0 0;color:var(--muted);font-size:15px}
.summary .act{margin-top:12px;width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px;font-weight:700}

.bill{border-top:1px solid var(--line);padding:4px 0 10px}
.bill:first-child{border-top:0}
.bill .item-main{padding:10px 0 6px}
.assign{display:flex;gap:8px}
.assign select{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:16px}
.assign button{flex:none;border:1.5px solid var(--ink);background:transparent;border-radius:10px;padding:8px 12px;font-weight:700;font-size:15px}

.empty{text-align:center;padding:28px 12px;color:var(--muted)}

dialog{margin:auto auto 0;width:100%;max-width:560px;border:0;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--ink);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 14px;font-size:20px;font-weight:800}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
.check-field{display:flex;gap:10px;align-items:center;margin:4px 0 14px;font-size:15px}
.check-field input{width:20px;height:20px;accent-color:var(--check)}
.sheet-actions{display:flex;gap:8px;align-items:center;margin-top:6px}
.sheet-actions .spacer{flex:1}
.sheet-actions button{border:0;border-radius:12px;padding:11px 16px;font-weight:700}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:var(--soft)}
.danger{color:var(--bad)}
.top-right{display:flex;align-items:center;gap:10px}
.icon-btn{border:0;background:var(--soft);border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px}
.pc-sub{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px;letter-spacing:0}
.stepper{display:flex;gap:8px}
.stepper button{flex:0 0 48px;border:1px solid var(--line);background:var(--soft);border-radius:12px;font-size:22px;font-weight:600}
.field .stepper input{flex:1;min-width:0;width:auto;text-align:center;font-weight:700;font-size:18px}
.radios{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.radios label{position:relative;cursor:pointer}
.radios input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.radios span{display:block;text-align:center;padding:9px 4px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.radios input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.radios input:focus-visible+span{outline:2px solid var(--check);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{background:var(--soft);border-radius:14px;padding:12px 14px;margin:2px 0 14px}
.preview .k{font-size:13px;color:var(--muted)}
.preview .pv-big{font-size:30px;font-weight:800;letter-spacing:-0.02em;line-height:1.15}
.preview table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.preview td{padding:3px 0}
.preview td:last-child{text-align:right}
.preview tr.sep td{border-top:1px solid var(--line);padding-top:6px}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 12px}
[hidden]{display:none!important}
.extra{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--extra-bg);color:var(--extra-ink);border-radius:12px;padding:10px 14px;margin:10px 0 4px}
.extra.over{background:var(--red-bg);color:var(--red-ink)}
.extra-k{display:block;font-weight:700}
.extra-sub{display:block;font-size:12.5px;opacity:.8}
.extra-v{font-size:19px;font-weight:800}
details.pc .extra{margin:4px 16px 10px}
.pane-title{display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tabs{display:flex;align-items:center;gap:8px}
.tabs .seg{flex:1}
.gear{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--soft);color:var(--ink);display:grid;place-items:center;padding:0}
.gear svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.status{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--soft);color:var(--muted);font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
.status.show{opacity:1}
/* status-bar strip when opened from the home screen (status bar text is white) */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#000000;z-index:40}
.login{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.login-card{width:100%;max-width:380px}
.login-icon{width:64px;height:64px;border-radius:16px;background:#1C1C1E;display:grid;place-items:center;margin-bottom:18px}
.login-icon span{width:34px;height:34px;border-radius:50%;background:var(--check);display:grid;place-items:center}
.login-icon svg{width:20px;height:20px;fill:none;stroke:var(--check-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.login h2{margin:0 0 4px;font-size:28px;font-weight:800;letter-spacing:-0.02em}
.login p{margin:0 0 20px;color:var(--muted)}
.login .field input{font-size:17px}
.login-err{min-height:20px;color:var(--bad);font-size:14px;font-weight:600;margin:0 0 10px!important}
.login-btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:17px}
.login-btn:disabled{opacity:.6}
.login .linkbtn{display:block;margin:12px auto 0}
.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:14px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
.import p{margin:0 0 12px;color:var(--muted);font-size:15px}
.import button{width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px;font-weight:700}
.install{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px 12px 14px;margin:2px 0 14px;font-size:15px}
.install span{flex:1}
.install button{flex:none;border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;padding:0}
.install svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;fill:none}
.acct{border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.acct .who{font-size:13px;color:var(--muted);margin:0 0 10px}
.acct-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.acct-btns button{border:0;background:var(--soft);border-radius:12px;padding:10px 6px;font-weight:700;font-size:14px}
.acct-btns .danger{color:var(--bad)}
.pill{display:inline-block;margin-left:7px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);vertical-align:2px}
.sugg{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);margin:0 0 10px}
.sugg-h{margin:0;padding:8px 12px 2px;font-size:12px;font-weight:700;color:var(--muted)}
.sugg button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;border-top:1px solid var(--line);background:none;padding:10px 12px;text-align:left}
.sugg .sugg-h + button{border-top:0}
.sugg .s-name{display:block;font-weight:600}
.sugg .s-sub{display:block;font-size:12.5px;color:var(--muted)}
.empty.small{padding:12px 4px;font-size:14px}
.check-row{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.check-row input{width:20px;height:20px;accent-color:var(--check)}
.count.red{background:var(--bad);color:#fff}
.banner.red{background:var(--red-bg);color:var(--red-ink)}
div.banner{cursor:default}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec-head h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-0.01em}
.sub-head{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 8px}
.sub-head h3{margin:0;font-size:17px;font-weight:700}
.item.rec{flex-wrap:wrap}
.item.rec .assign{flex-basis:100%;padding:0 0 12px 36px}
.xcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2px 14px 12px;margin-bottom:8px}
.xcard.is-red{border-color:var(--bad)}
.xcard .item-main{display:flex;width:100%;padding:12px 36px 10px 0}
.xcard .item-main:last-child{padding-bottom:0}
.xbtn{position:absolute;top:4px;right:4px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--muted)}
.xbtn:hover{background:var(--soft)}
.xbtn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;fill:none}
.addcard{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:4px 12px 6px;margin-bottom:8px}
.addcard .add{border-top:0;margin:0}
.add input[name="day"]{width:64px}
.buy-sum{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:15px}
.buy-sum button{flex:none;border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:14px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:10px 10px 10px 16px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:15px}
.toast button{border:0;background:transparent;color:var(--check);font-weight:800;padding:6px 8px}
/* no double-tap zoom on buttons */
html{touch-action:manipulation}
button,a,input,select,label,textarea,summary{touch-action:manipulation}
/* iOS date fields: stay inside the screen, text on the left */
input[type="date"],input[type="month"],input[type="time"]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;min-height:46px}
.add input[type="date"]{display:inline-block;min-height:0}
input::-webkit-date-and-time-value{text-align:left;margin:0}
.field textarea{font-size:16px}
#sheetTitle:focus{outline:none}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
/* settings */
.set-list{list-style:none;margin:0 0 14px;padding:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.set-row{display:flex;width:100%;align-items:center;gap:12px;border:0;border-top:1px solid var(--line);background:none;padding:12px 14px;text-align:left}
.set-list li:first-child .set-row{border-top:0}
.set-row .t{display:block;font-weight:700}
.set-row .s{display:block;font-size:13px;color:var(--muted)}
.set-row .chev{margin-left:auto;color:var(--muted);font-size:22px;line-height:1}
.set-ico{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--soft)}
.set-ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.grp-h{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 6px}
.grp-h:first-child{margin-top:0}
.card-box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:2px 14px;margin-bottom:10px}
.card-box .field{margin:10px 0}
.sw-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.card-box > .sw-row:first-child,.card-box > div:first-child > .sw-row:first-child{border-top:0}
.sw-row > span{flex:1;min-width:0}
.sw-row .t{display:block;font-weight:600}
.sw-row .s{display:block;font-size:13px;color:var(--muted)}
.switch{flex:none;position:relative;width:51px;height:31px;-webkit-appearance:none;appearance:none;background:var(--line);border-radius:999px;margin:0;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch:checked{background:var(--check)}
.switch:checked::after{transform:translateX(20px)}
.sub-opts{padding:0 0 10px}
.sub-opts .field{margin:0 0 8px}
.sub-opts .two .field{margin:0}
.note{background:var(--banner);color:var(--banner-ink);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.plans{display:grid;gap:8px;margin-bottom:6px}
.plans label{position:relative;display:block;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;background:var(--bg)}
.plans input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.plans label:has(input:checked){border-color:var(--ink)}
.plans .pn{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.plans .pd{display:block;font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:800;background:var(--check);color:var(--check-ink);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}

      if (noDay(r)){ if (!isPaidNow(r)) yellow.push(e); continue; }

  // ---------- automatic bills ----------
  // ---------- pay schedule ----------
  const lastDayOf = (y, m0) => new Date(y, m0 + 1, 0).getDate();
  function schedIn(y, m0){
    const s = state.settings, L = lastDayOf(y, m0);
    const days = s.payFreq === "semimonthly" ? (s.semiDays === "1-15" ? [1, 15] : [15, L]) : [s.payDay ? Math.min(s.payDay, L) : L];
    return days.map(d => iso(new Date(y, m0, d)));
  }
  // twice-a-month and monthly pay: the scheduled paydays around d, and which one d is (paydays moved a day or two still match)
  function schedAround(d){
    const x = parseISO(d), list = [];
    for (let k = -2; k <= 2; k++){ const m = new Date(x.getFullYear(), x.getMonth() + k, 1); list.push(...schedIn(m.getFullYear(), m.getMonth())); }
    let best = 0;
    for (let i = 1; i < list.length; i++) if (Math.abs(parseISO(list[i]) - x) < Math.abs(parseISO(list[best]) - x)) best = i;
    return {list, i: best};
  }
  const stepPay = () => ({weekly: 7, biweekly: 14})[state.settings.payFreq];
  function nextPayday(d){ const st = stepPay(); if (st) return addDays(d, st); const a = schedAround(d); return a.list[a.i + 1]; }
  function prevPayday(d){ const st = stepPay(); if (st) return addDays(d, -st); const a = schedAround(d); return a.list[a.i - 1]; }
  function snapPay(d){ if (stepPay()) return d; const a = schedAround(d); return a.list[a.i]; }

  function payIndex(p){
    const d = snapPay(p.date), m = d.slice(0, 7); let n = 1, x = d;
    for (let g = 0; g < 6; g++){ x = prevPayday(x); if (x.slice(0, 7) !== m) break; n++; }
    return n;
  }
  function lastInMonth(p){ const d = snapPay(p.date); return nextPayday(d).slice(0, 7) !== d.slice(0, 7); }
  function weekOk(p, w){ return w === "last" ? lastInMonth(p) : payIndex(p) === Number(w); }
  function placeOcc(r, o, p){
    if (o < r.since || (r.paidThrough && o <= r.paidThrough) || r.skip.includes(o) || linkedAll(r, o).length) return false;
    const nm = r.name.trim().toLowerCase();
    const ex = p.items.find(i => !i.recId && i.name.trim().toLowerCase() === nm);
    if (ex){ ex.recId = r.id; ex.recFor = o; if (!ex.cat) ex.cat = r.cat || ""; return true; }
    p.items.push({id: "a-" + r.id + "-" + o, name: r.name, amount: r.amount, paid: false, due: noDay(r) ? "" : o, recId: r.id, recFor: o, cat: r.cat || ""});

  }
  // puts bills marked "automatic" on the right upcoming paychecks; true if anything changed
  function autoFill(){
    const t = iso(today());
    const all = [...state.paychecks].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    const upcoming = all.filter(p => p.date >= t);
    if (!upcoming.length) return false;
    const end = addDays(upcoming[upcoming.length - 1].date, Math.max(6, Math.round(PERIOD_DAYS[state.settings.payFreq] || 7) - 1));
    let changed = false;
    for (const r of state.recurring){
      if (!r.auto || groupOff(r)) continue;
      if (r.skip.length > 30) r.skip = r.skip.filter(x => x >= addDays(t, -60));
      if (r.freq === "monthly" && r.autoWeek){
        for (const p of upcoming) if (weekOk(p, r.autoWeek)) changed = placeOcc(r, occOnOrAfter(r, p.date), p) || changed;
        continue;

      let o = occOnOrAfter(r, upcoming[0].date), guard = 0;
      while (o <= end && guard++ < 80){
        let p = null; for (const q of all) if (q.date <= o) p = q;
        if (p && p.date >= t) changed = placeOcc(r, o, p) || changed;
        o = nextOcc(r, o);
      }
    }
    return changed;
  }

  // ---------- suggestions while adding an item to a paycheck ----------
  function suggestionsFor(pc, q){
    q = (q || "").trim().toLowerCase();

    data.forEach((d, i) => { if (i % every === 0 || i === data.length - 1) g += '<text class="cx" x="' + f1(PL + band * i + band / 2) + '" y="' + (CH - 7) + '">' + d.label + '</text>'; });
    const hits = data.map((d, i) => '<rect class="chit" data-act="anaPt" data-i="' + i + '" x="' + f1(PL + band * i) + '" y="' + PT + '" width="' + f1(band) + '" height="' + PH + '"><title>' + esc(d.long) + '</title></rect>').join("");
    return '<svg class="chart" viewBox="0 0 ' + CW + ' ' + CH + '" role="img" aria-label="' + label + '">' + g + inner + hits + '</svg>';
  }
  function lineChart(data, keys){
    const band = PW / data.length, X = i => PL + band * i + band / 2;
    const series = !anaSplit ? [{color: "#F5F5F7", vals: data.map(d => d.total)}]
      : keys.filter(k => !anaFocus || k === anaFocus).map(k => ({color: chartColor(k), vals: data.map(d => d.by[k] || 0)}));
    const max = niceMax(Math.max(0, ...series.map(s => Math.max(0, ...s.vals))));
    const Y = v => PT + PH - (v / max) * PH;
    let inner = "";
    if (anaPt >= 0 && anaPt < data.length) inner += '<line class="cguide" x1="' + f1(X(anaPt)) + '" x2="' + f1(X(anaPt)) + '" y1="' + PT + '" y2="' + (PT + PH) + '"/>';
    const r = series.length > 3 ? 3 : 4;
    for (const s of series){
      let d = "", pen = false;
      s.vals.forEach((v, i) => { if (data[i].empty){ pen = false; return; } d += (pen ? "L" : "M") + f1(X(i)) + " " + f1(Y(v)) + " "; pen = true; });
      if (d.indexOf("L") >= 0) inner += '<path class="cline" stroke="' + s.color + '" d="' + d.trim() + '"/>';
      inner += s.vals.map((v, i) => data[i].empty ? "" : '<circle class="cdot" cx="' + f1(X(i)) + '" cy="' + f1(Y(v)) + '" r="' + (i === anaPt ? r + 1.5 : r) + '" fill="' + s.color + '"/>').join("");
    }
    return chartSvg("Line chart of spending by " + (isWeekly() ? "week" : "month"), data, max, inner);
  }
  function barPath(x, y, w, h, round){
    const r = round ? Math.min(4, h, w / 2) : 0;
    return "M" + f1(x) + " " + f1(y + h) + "V" + f1(y + r) + (r ? "Q" + f1(x) + " " + f1(y) + " " + f1(x + r) + " " + f1(y) : "") +
      "H" + f1(x + w - r) + (r ? "Q" + f1(x + w) + " " + f1(y) + " " + f1(x + w) + " " + f1(y + r) : "") + "V" + f1(y + h) + "Z";
  }
  function barChart(data, keys){
    const band = PW / data.length, bw = Math.min(26, band * 0.62);
    const stacks = data.map(d => !anaSplit ? [{c: "var(--check)", v: d.paid}, {c: "var(--plan)", v: Math.max(0, d.total - d.paid)}]
      : keys.filter(k => !anaFocus || k === anaFocus).map(k => ({c: chartColor(k), v: d.by[k] || 0})));
    const max = niceMax(Math.max(0, ...stacks.map(st => st.reduce((a, s) => a + s.v, 0))));
    let inner = "";
    stacks.forEach((st, i) => {
      const x = PL + band * i + (band - bw) / 2, segs = st.filter(s => s.v > 0.004);
      let y = PT + PH;
      segs.forEach((s, j) => {
        const h = s.v / max * PH, top = j === segs.length - 1, gap = top ? 0 : Math.min(1.5, h / 2);
        inner += '<path fill="' + s.c + '" d="' + barPath(x, y - h + gap, bw, Math.max(0.5, h - gap), top) + '"' + (anaPt >= 0 && anaPt !== i ? ' opacity="0.4"' : "") + '/>';
        y -= h;
      });
    });
    return chartSvg("Bar chart of spending by " + (isWeekly() ? "week" : "month"), data, max, inner);
  }
  function chartReadout(data, keys){
    if (anaPt < 0 || anaPt >= data.length) return '<p class="ana-read">Tap the chart to see a ' + (isWeekly() ? "week" : "month") + '.</p>';
    const d = data[anaPt];
    if (d.empty) return '<p class="ana-read"><strong>' + esc(d.long) + '</strong> No paychecks yet.</p>';
    const status = d.paid >= d.total - 0.004 ? "all checked off" : d.paid > 0.004 ? money(d.paid) + " checked off" : "none checked off yet";
    let h = '<p class="ana-read"><strong>' + esc(d.long) + '</strong> ' +
      (anaSplit && anaFocus ? esc(catName(anaFocus)) + ", " + money(d.by[anaFocus] || 0) : money(d.total) + ", " + status) + '</p>';
    if (anaSplit && !anaFocus){
      const top = keys.filter(k => d.by[k] > 0.004).sort((a, b) => d.by[b] - d.by[a]).slice(0, 3);
      if (top.length) h += '<p class="ana-read">' + top.map(k => '<span class="rd"><i style="background:' + chartColor(k) + '"></i>' + esc(catName(k)) + ' ' + money(d.by[k]) + '</span>').join("") + '</p>';
    }
    return h;
  }
  function chipsHtml(keys){
    return '<div class="chips"><button class="chip" data-act="anaFocus" data-cat="" aria-pressed="' + !anaFocus + '">All</button>' +
      keys.map(k => '<button class="chip" data-act="anaFocus" data-cat="' + k + '" aria-pressed="' + (anaFocus === k) + '"><i style="background:' + chartColor(k) + '"></i>' + esc(catName(k)) + '</button>').join("") + '</div>';
  }
  function pieChart(cur, keys){
    const total = keys.reduce((a, k) => a + cur.by[k].total, 0);
    if (total <= 0.004) return '<p class="ana-read">No spending in this period yet.</p>';
    const R = 92, SW = 34, C = 2 * Math.PI * R;
    let off = 0, arcs = "";
    for (const k of keys){
      const v = cur.by[k].total, len = v / total * C, gap = len > 6 ? 2 : 0, sel = anaSlice === k;
      arcs += '<circle class="pslice" data-act="anaSlice" data-cat="' + k + '" cx="120" cy="120" r="' + R + '" stroke="' + chartColor(k) + '" stroke-width="' + (sel ? SW + 10 : SW) + '"' +
        ' stroke-dasharray="' + Math.max(0.6, len - gap).toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '"' + (anaSlice && !sel ? ' opacity="0.3"' : "") + '>' +
        '<title>' + esc(catName(k)) + ': ' + money(v) + '</title></circle>';
      off += len;
    }
    const s = anaSlice && cur.by[anaSlice] ? cur.by[anaSlice] : null;
    const mid = s ? '<span class="k">' + esc(catName(anaSlice)) + '</span><span class="v num">' + money(s.total) + '</span><span class="s">' + Math.round(s.total / total * 100) + '% of spending</span>'
      : '<span class="k">Spending</span><span class="v num">' + money(total) + '</span><span class="s">' + keys.length + (keys.length === 1 ? " category" : " categories") + '</span>';
    return '<div class="pie-wrap"><svg viewBox="0 0 240 240" role="img" aria-label="Pie chart of spending by category"><g transform="rotate(-90 120 120)">' + arcs + '</g></svg><div class="pie-mid">' + mid + '</div></div>' +
      '<div class="pie-legend">' + keys.map(k => '<button data-act="anaSlice" data-cat="' + k + '" aria-pressed="' + (anaSlice === k) + '"><i style="background:' + chartColor(k) + '"></i>' +
        '<span class="n">' + esc(catName(k)) + '</span><span class="a num">' + money(cur.by[k].total) + '</span><span class="p">' + Math.round(cur.by[k].total / total * 100) + '%</span></button>').join("") + '</div>';
  }
  function anaDotsHtml(){ return [0, 1, 2].map(i => '<span class="d' + (i === anaSlide ? " on" : "") + '"></span>').join(""); }
  function syncAnaRail(){
    const rail = $("#anaRail"); if (!rail || !rail.offsetParent) return;
    const sl = rail.children[anaSlide];
    if (sl) rail.scrollLeft = sl.offsetLeft - (parseFloat(getComputedStyle(rail).paddingLeft) || 0);
    fitAnaRail();
  }
  // the rail is as tall as the slide showing, so short charts don't leave a gap under them
  function fitAnaRail(){
    const rail = $("#anaRail"); if (!rail) return;
    const sl = rail.children[anaSlide];
    if (sl) rail.style.height = sl.offsetHeight + "px";
  }
  window.addEventListener("resize", () => { const rail = $("#anaRail"); if (rail){ rail.style.height = ""; fitAnaRail(); } });
  let anaTimer = null;
  document.addEventListener("scroll", e => {
    const rail = e.target;
    if (!rail || rail.id !== "anaRail") return;
    clearTimeout(anaTimer);
    anaTimer = setTimeout(() => {
      const pad = parseFloat(getComputedStyle(rail).paddingLeft) || 0;
      let best = 0, bd = Infinity;
      [...rail.children].forEach((c, i) => { const d = Math.abs(c.offsetLeft - pad - rail.scrollLeft); if (d < bd){ bd = d; best = i; } });
      if (best === anaSlide) return;
      anaSlide = best;
      const dots = $("#anaDots"); if (dots) dots.innerHTML = anaDotsHtml();
      fitAnaRail();
    }, 90);
  }, true);

  function renderAnalysis(){
    const rg = rangeFor(anaRange, 0), pv = rangeFor(anaRange, 1);
    const cur = spendIn(rg), prev = spendIn(pv);
    let h = '<h1 class="page-h">Spending analysis</h1>';
    h += '<div class="rng" role="tablist" aria-label="Period">' + RANGES.map(([k, l]) =>
      '<button role="tab" data-act="anaRange" data-r="' + k + '" aria-selected="' + (k === anaRange) + '">' + l + '</button>').join("") + '</div>';
    if (!cur.checks) return h + '<p class="empty">No paychecks in ' + rg.label + ' yet.</p>';
    const left = cur.income - cur.spent - cur.saved, still = cur.spent - cur.paid;
    h += '<section class="summary ana-sum"><p style="margin:0">Spending, ' + rg.label + '</p><div class="big num">' + money(cur.spent) + '</div>' +
      '<div class="ana-kv"><div><span class="k">Paychecks</span><span class="v num">' + money(cur.income) + '</span></div>' +
      '<div><span class="k">Saved</span><span class="v num">' + money(cur.saved) + '</span></div>' +
      '<div><span class="k">' + (left < -0.004 ? "Over by" : "Left over") + '</span><span class="v num' + (left < -0.004 ? " bad" : "") + '">' + money(Math.abs(left)) + '</span></div></div>' +
      '<p>' + money(cur.paid) + ' checked off' + (still > 0.004 ? ", " + money(still) + " still planned" : "") + '.</p></section>';

    if (cur.uncat.length){
      const names = new Map();
      for (const it of cur.uncat){ const k = normName(it.name); const e = names.get(k) || {name: it.name.trim(), n: 0, total: 0}; e.n++; e.total += it.amount; names.set(k, e); }
      h += '<section class="pc need-cat"><h3>' + names.size + (names.size === 1 ? " item needs" : " items need") + ' a category</h3><ul class="items">' +
        [...names.values()].map(e => '<li class="item"><button class="item-main" data-act="catName" data-name="' + esc(e.name) + '">' +
          '<span class="item-name">' + esc(e.name) + '<span class="due">' + (e.n > 1 ? e.n + " times, " : "") + money(e.total) + '</span></span><span class="pick">Pick</span></button></li>').join("") +
        '</ul></section>';
    }

    const keys = Object.keys(cur.by).filter(k => k !== "savings" && cur.by[k].total > 0.004).sort((a, b) => (a === "") - (b === "") || cur.by[b].total - cur.by[a].total);
    if (anaFocus && !keys.includes(anaFocus)) anaFocus = "";
    if (anaSlice && !keys.includes(anaSlice)) anaSlice = "";

    // the charts, one per slide
    const data = chartData(rg, keys), per = isWeekly() ? "week" : "month";
    const seg = '<div class="mini-seg" role="group" aria-label="Show"><button data-act="anaSplit" data-v="0" aria-pressed="' + !anaSplit + '">Total</button>' +
      '<button data-act="anaSplit" data-v="1" aria-pressed="' + anaSplit + '">Categories</button></div>';
    h += '<div class="ana-rail" id="anaRail">' +
      '<section class="ana-slide" aria-label="Pie chart"><div class="ana-slide-h"><h3>Where it went</h3></div>' + pieChart(cur, keys) + '</section>' +
      '<section class="ana-slide" aria-label="Line chart"><div class="ana-slide-h"><h3>Trend by ' + per + '</h3>' + seg + '</div>' +
        lineChart(data, keys) + chartReadout(data, keys) + (anaSplit ? chipsHtml(keys) : "") + '</section>' +
      '<section class="ana-slide" aria-label="Bar chart"><div class="ana-slide-h"><h3>Spending by ' + per + '</h3>' + seg + '</div>' +
        barChart(data, keys) + chartReadout(data, keys) +
        (anaSplit ? chipsHtml(keys) : '<div class="legend"><span><i class="p"></i>Checked off</span><span><i class="u"></i>Still planned</span></div>') + '</section>' +
      '</div><div class="dots ana-dots" id="anaDots">' + anaDotsHtml() + '</div>';

    const max = Math.max(0, ...keys.map(k => cur.by[k].total), cur.by.savings ? cur.by.savings.total : 0);
    const row = key => {
      const c = CAT_MAP[key] || NO_CAT, e = cur.by[key];
      const pd = prev.by[key] ? prev.by[key].total : 0, d = e.total - pd;
      const sub = [];
      if (key !== "savings" && cur.spent > 0) sub.push(Math.round(e.total / cur.spent * 100) + "% of spending");
      if (pd > 0) sub.push(Math.abs(d) < 0.5 ? "same as " + pv.short : (d > 0 ? "▲ " : "▼ ") + money(Math.abs(d)) + " vs " + pv.short);
      const items = e.items.slice().sort((a, b) => a.pc.date < b.pc.date ? 1 : a.pc.date > b.pc.date ? -1 : 0);
      return '<details class="cat-row" data-cat="' + key + '"' + (anaOpen.has(key) ? " open" : "") + '><summary>' +
        catIcon(key) + '<span class="cat-mid"><span class="cat-top"><span class="cat-n">' + c[1] + '</span>' +
        '<span class="num cat-v">' + money(e.total) + '</span></span>' + hbar(e.paid, e.total, max) + '<span class="cat-sub">' + sub.join(" · ") + '</span></span></summary>' +
        '<ul class="items">' + items.map(({pc, it}) => '<li class="item' + (it.paid ? " is-paid" : "") + '"><button class="item-main" data-act="editItem" data-pc="' + pc.id + '" data-id="' + it.id + '">' +
          '<span class="item-name">' + esc(it.name) + '<span class="due">' + dayLabel(pc.date) + ' check' + (it.paid ? "" : ", not checked off yet") + '</span></span>' +
          '<span class="num">' + money(it.amount) + '</span></button></li>').join("") + '</ul></details>';
    };
    h += '<div class="sub-head"><h3>By category</h3></div>' +
      '<div class="legend"><span><i class="p"></i>Checked off</span><span><i class="u"></i>Still planned</span></div>' +
      '<section class="pc cats">' + keys.map(row).join("") + '</section>';
    if (cur.by.savings && cur.by.savings.total > 0.004) h += '<div class="sub-head"><h3>Saved</h3></div><section class="pc cats">' + row("savings") + '</section>';
    return h;
  }

  // ---------- render ----------
  function render(){
    document.querySelectorAll('.tabbar button').forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    const bc = $("#expCount");

      const a = alerts(), n = a.red.length || a.yellow.length;

    $("#panePay").innerHTML = renderPay();

  const TICK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4 4 9-9.5"/></svg>';
  const PLUS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  function itemRow(i, pc){
    const showDue = i.due && i.due !== pc.date;
    return '<li class="row' + (i.paid ? " is-paid" : "") + '">' +
      '<button class="row-main" data-act="editItem" data-pc="' + pc.id + '" data-id="' + i.id + '">' + catIcon(i.cat) +
        '<span class="row-name">' + esc(i.name) + (showDue ? '<span class="row-sub">due ' + dayLabel(i.due) + '</span>' : "") + '</span>' +
        '<span class="row-amt num">' + money(i.amount) + '</span></button>' +
      '<button class="tick" data-act="toggle" data-pc="' + pc.id + '" data-id="' + i.id + '" aria-pressed="' + i.paid + '" aria-label="' + (i.paid ? "Unmark " : "Mark ") + esc(i.name) + ' as paid">' + TICK + '</button></li>';
  }

  function pcSub(p){
    if (!p.hours) return "";
    if (state.settings.payType === "salary" || p.hoursSet) return esc(hoursLabel(p.hours));
    return "Estimated: " + esc(hoursLabel(p.hours));
  }
  // Paid, Still to pay, Est. balance and Extra on one line, same size, then one bar for the whole check:
  // paid | [still to pay | extra], with an outline around the part that should still be in the account
  function pcSummary(amt, planned, paid){
    const extra = amt - planned, left = amt - paid, toPay = Math.max(0, planned - paid);
    const over = extra < -0.004, total = Math.max(amt, planned, 0.01);
    const pct = v => Math.max(0, Math.min(100, v / total * 100)).toFixed(2) + "%";
    const vals = [paid, toPay, left, Math.abs(extra)];
    const small = vals.some(v => money(v).length >= 8);
    const stat = (k, v, cls, dot) => '<div class="st"><span class="k">' + (dot ? '<i class="dot ' + dot + '"></i>' : "") + k + '</span>' +
      '<span class="v num' + (cls ? " " + cls : "") + '">' + money(v) + '</span></div>';
    let h = '<div class="pc-line' + (small ? " sm" : "") + '">' +
      stat("Paid", paid, "", "p") +
      stat("Still to pay", toPay, "", "u") +
      stat("Est. balance", left, left < -0.004 ? "bad" : "", "eb") +
      stat(over ? "Over by" : "Extra", Math.abs(extra), over ? "bad" : "good", over ? "" : "x") + '</div>';
    const seg = (cls, v, grow) => v > 0.004 ? '<span class="' + cls + '" style="' + (grow ? "flex:" + v.toFixed(2) + " 1 0" : "width:" + pct(v)) + '"></span>' : "";
    h += '<div class="pc-sum" aria-hidden="true"><div class="pc-bar">' + seg("p", paid);
    if (left > 0.004 && amt > 0){
      const inCheck = Math.min(toPay, left);   // still-to-pay that the check covers
      h += '<span class="eb" style="width:' + pct(left) + '">' + seg("u", inCheck, true) + (!over ? seg("x", extra, true) : "") + '</span>';
      if (over) h += seg("ovs", planned - amt);
    } else {
      h += seg("u", toPay) + (over && amt > 0 ? '<span class="ov" style="left:' + pct(amt) + '"></span>' : "");
    }
    return h + '</div></div>';
  }

  // ---------- paychecks page: swipe between checks, the last slide adds one ----------
  let selPc = null;   // the check whose items show below the cards; "add" = the add-a-paycheck slide
  const railList = () => [...state.paychecks].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  function curSel(){
    if (selPc === "add" || (selPc && findPc(selPc))) return selPc;
    const g = groups();
    selPc = g.upcoming[0] ? g.upcoming[0].id : "add";
    return selPc;
  }
  function nextPaydayAfterLast(){ const l = railList(); return l.length ? nextPayday(l[l.length - 1].date) : iso(today()); }
  function pcCard(p){
    const amt = pcAmount(p), planned = sum(p.items), paid = sum(p.items.filter(i => i.paid)), sub = pcSub(p);
    return '<section class="pc-card" data-pc="' + p.id + '" aria-label="Paycheck ' + dayLabel(p.date) + '">' +
      '<div class="pc-top"><div><span class="pc-date">' + dayLabel(p.date) + '</span><span class="pc-amt num">' + money(amt) + '</span></div>' +
      '<button class="pc-adjust" data-act="editPc" data-id="' + p.id + '">Adjust check</button></div>' +

  }
  function addCard(){
    return '<button class="pc-card pc-add" data-pc="add" data-act="newPc"><span class="pc-plus">' + PLUS + '</span>' +
      '<span class="pc-add-t">Add a paycheck</span><span class="pc-add-s">Next payday: ' + dayLabel(nextPaydayAfterLast()) + '</span></button>';
  }
  function dotsHtml(sel){
    const ids = railList().map(p => p.id).concat("add"), n = ids.length, i = Math.max(0, ids.indexOf(sel));
    const W = 9, start = Math.max(0, Math.min(i - 4, n - W)), end = Math.min(n, start + W);
    let h = "";
    for (let k = start; k < end; k++){
      h += ids[k] === "add" ? '<svg class="dot-plus' + (k === i ? " on" : "") + '" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5v7M1.5 5h7"/></svg>'
        : '<span class="d' + (k === i ? " on" : "") + '"></span>';
    }
    return h;
  }
  function pcItems(pc){
    if (!pc){
      return '<div class="pc-empty"><strong>' + dayLabel(nextPaydayAfterLast()) + ' isn\'t planned yet</strong>' +
        '<span>Add it to see what this check covers. Bills set to go on paychecks automatically fill in on their own.</span></div>';
    }
    const toPay = pc.items.filter(i => !i.paid), paid = pc.items.filter(i => i.paid);

      : '<p class="rows-empty">' + (pc.items.length ? "Everything on this check is paid." : "Nothing on this check yet.") + '</p>';
    h += '<button class="newitem" data-act="newItem" data-pc="' + pc.id + '">' + PLUS + 'New item</button>';
    if (paid.length) h += '<div class="grp-head"><span>Paid</span><span class="num">' + money(sum(paid)) + '</span></div><ul class="rows">' + paid.map(i => itemRow(i, pc)).join("") + '</ul>';
    return h;
  }
  function renderPay(){
    let h = '<h1 class="page-h">Paychecks</h1>';
    if (!isStandalone() && isIOS() && !lsGet("install-dismissed")){
      h += '<div class="install"><span><strong>Make it an app:</strong> tap the Share button in Safari, then <strong>Add to Home Screen</strong>. It will open full screen from your home screen.</span>' +
        '<button data-act="installDismiss" aria-label="Dismiss">' + XSVG + '</button></div>';
    }
    if (!state.paychecks.length && !state.recurring.length && !state.payments.length && !state.wishlist.length){
      h += '<section class="pc import"><h2 class="sect" style="margin-top:0">Bring over your budget</h2>' +
        '<p>Paste the data from the Claude version or a backup. Or start fresh by adding a paycheck below.</p>' +
        '<button data-act="importData">Paste my data</button></section>';
    }
    h += renderBanners(true);
    const sel = curSel();
    h += '<div class="pc-rail" id="pcRail">' + railList().map(pcCard).join("") + addCard() + '</div>';
    h += '<div class="dots" id="pcDots">' + dotsHtml(sel) + '</div>';
    h += '<div id="pcItems">' + pcItems(sel === "add" ? null : findPc(sel)) + '</div>';
    return h;
  }
  // after a redraw, put the cards back where they were
  function syncRail(){
    const rail = $("#pcRail"); if (!rail || !rail.offsetParent) return;
    const card = rail.querySelector('[data-pc="' + curSel() + '"]');
    if (card) rail.scrollLeft = card.offsetLeft - (parseFloat(getComputedStyle(rail).paddingLeft) || 0);
  }
  // when a swipe settles, show that check's items
  let railTimer = null;
  document.addEventListener("scroll", e => {
    const rail = e.target;
    if (!rail || rail.id !== "pcRail") return;
    clearTimeout(railTimer);
    railTimer = setTimeout(() => {
      const pad = parseFloat(getComputedStyle(rail).paddingLeft) || 0;
      let best = null, bd = Infinity;
      for (const c of rail.children){ const d = Math.abs(c.offsetLeft - pad - rail.scrollLeft); if (d < bd){ bd = d; best = c; } }
      if (!best || best.dataset.pc === curSel()) return;
      selPc = best.dataset.pc;
      const items = $("#pcItems"); if (items) items.innerHTML = pcItems(selPc === "add" ? null : findPc(selPc));
      const dots = $("#pcDots"); if (dots) dots.innerHTML = dotsHtml(selPc);
    }, 90);
  }, true);

  // adding an item: name and amount, suggestions as you type, then the category
  function newItemSheet(pcId){
    const pc = findPc(pcId); if (!pc) return;
    openSheet({
      title: "New item", saveText: "Next", focus: "name",
      body: field("Name", '<input name="name" autocomplete="off" required>') +
        field("Amount", '<input name="amount" inputmode="decimal" placeholder="$0" autocomplete="off">') +
        '<div id="sheetSugg"></div>',
      onInput: () => renderSheetSugg(pc),
      onSave: fd => {
        const name = String(fd.get("name") || "").trim(); if (!name) return false;
        if (name.toLowerCase() === "extra"){ setStatus("Extra is calculated for you"); return false; }
        const amt = toNum(fd.get("amount"));
        askCategory(name, amt, catGuess(name), cat => {
          pc.items.push({id: uid(), name, amount: amt, paid: false, due: "", cat});
          commit(); setStatus("Added to " + dayLabel(pc.date));
        });
        return false;
      }
    });
    sheetCfg.onInput();
  }
  function renderSheetSugg(pc){
    const box = $("#sheetSugg"); if (!box) return;
    if (!state.settings.sugg){ box.innerHTML = ""; return; }
    const list = suggestionsFor(pc, $("#sheetForm").elements.name.value);
    box.innerHTML = !list.length ? "" : '<div class="sugg"><p class="sugg-h">Suggestions</p>' + list.map(s =>
      '<button type="button" data-act="sugg" data-pc="' + pc.id + '" data-kind="' + s.kind + '" data-id="' + esc(s.id) + '" data-amt="' + s.amount + '" data-cat="' + (s.cat || "") + '">' +
      '<span><span class="s-name">' + esc(s.name) + '</span><span class="s-sub">' + esc(s.sub) + '</span></span><span class="num">' + money(s.amount) + '</span></button>').join("") + '</div>';
  }

  function renderBanners(link){
    const a = alerts(); let h = "";
    const open = cls => link ? '<button class="banner ' + cls + '" data-act="tab" data-tab="exp">' : '<div class="banner ' + cls + '">';
    const close = link ? '<span class="banner-cta">Plan it</span></button>' : '</div>';
    if (a.red.length){
      const names = a.red.slice(0, 3).map(e => esc(e.name) + " (" + (e.days < 0 ? "overdue" : e.days === 0 ? "today" : dayLabel(e.due)) + ")").join(", ") +
        (a.red.length > 3 ? ", and " + (a.red.length - 3) + " more" : "");
      h += open("red") + '<span><strong class="num">' + money(sum(a.red)) + '</strong> due soon and not on a paycheck: ' + names + '.</span>' + close;
    }
    if (a.yellow.length){
      h += open("") + '<span><strong class="num">' + money(sum(a.yellow)) + '</strong> in upcoming payments isn\'t on a paycheck yet.</span>' + close;
    }
    return h;
  }

  const XSVG = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"/></svg>';
  function assignHtml(id, sug, act, g){
    if (!g.upcoming.length) return "";
    return '<div class="assign"><select data-sel="' + id + '" aria-label="Paycheck">' +
      g.upcoming.map(p => '<option value="' + p.id + '"' + (p.id === sug ? " selected" : "") + '>' + dayLabel(p.date) + '</option>').join("") +
      '</select><button data-act="' + act + '" data-id="' + id + '">Put on check</button></div>';
  }

  function recRow(r, g){
    const o = openOcc(r), paid = isPaidNow(r), ls = linkedAll(r, o), days = daysUntil(o), nd = noDay(r);
    let sub = "", red = false;
    if (paid) sub = paidLabel(r) + (nd ? "" : ". Next due " + dayLabel(o));
    else if (nd) sub = "No set due day";
    else { sub = dueText(days, o); red = days <= redDays() && !ls.length; }
    const onChecks = " on the " + ls.map(l => dayLabel(l.pc.date)).join(" and ") + (ls.length > 1 ? " checks" : " check");
    if (ls.length && !paid && ls.length === 1 && ls[0].pc.date === o) sub = "On the" + onChecks.slice(7);
    else if (ls.length) sub += (paid && nd ? ". Next one is" : ",") + onChecks;
    const showAssign = !ls.length && (nd ? !paid : days <= warnDays());
    return '<li class="item rec' + (paid ? " is-paid" : "") + '">' +
      '<button class="chk" data-act="recToggle" data-id="' + r.id + '" aria-pressed="' + paid + '" aria-label="' + (paid ? "Unmark " : "Mark ") + esc(r.name) + ' as paid">' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9"/></svg></button>' +
      '<button class="item-main" data-act="editRec" data-id="' + r.id + '">' + catIcon(r.cat, "sm") + '<span class="item-name">' + esc(r.name) + (r.auto ? '<span class="pill">Auto</span>' : "") +
      '<span class="due' + (red ? " bad" : "") + '">' + sub + '</span></span><span class="num">' + money(r.amount) + '</span></button>' +
      (showAssign ? assignHtml(r.id, suggestPaycheck(o, g.upcoming), "recAssign", g) : "") + '</li>';
  }
  const REC_EMPTY = {weekly: "Things you pay every week, like groceries or gas.", biweekly: "Bills that come every other week.",
    monthly: "Rent, car, utilities and other monthly bills.", yearly: "Car tags, memberships and other once-a-year bills."};
  const REC_PER = {weekly: " a week", biweekly: " every 2 weeks", monthly: " a month", yearly: " a year"};
  function addRecForm(f, g){
    const t = iso(today()), next = g.upcoming.find(p => p.date >= t);
    if (f === "monthly") return '<form class="add" data-form="addRec" data-freq="monthly">' +
      '<input name="name" placeholder="New bill" aria-label="Bill name" autocomplete="off" required>' +
      '<input name="amount" inputmode="decimal" placeholder="$0" aria-label="Amount" autocomplete="off" required>' +
      '<input name="day" inputmode="numeric" placeholder="Day" aria-label="Due day of the month" autocomplete="off">' +
      '<button type="submit">Add</button></form>';
    const dflt = f === "yearly" ? "" : (next ? next.date : t);
    return '<form class="add add-wrap" data-form="addRec" data-freq="' + f + '">' +
      '<input name="name" placeholder="New ' + (f === "weekly" ? "weekly expense" : "bill") + '" aria-label="Name" autocomplete="off" required style="flex-basis:100%">' +
      '<input name="amount" inputmode="decimal" placeholder="$0" aria-label="Amount" autocomplete="off" required>' +
      '<input name="due" type="date" aria-label="Next due date" value="' + dflt + '"' + (f === "yearly" ? " required" : "") + '>' +
      '<button type="submit">Add</button></form>';
  }

  function renderExpenses(){
    const g = groups();
    let h = renderBanners(false);

    // recurring bills, grouped by how often they come
    const on = FREQS.filter(f => !(state.settings.groupsOff || []).includes(f));
    const recsOn = state.recurring.filter(r => on.includes(r.freq));
    h += '<div class="sec-head"><h2>Recurring bills</h2><span class="num muted">' + money(recsOn.reduce((a, r) => a + perMonth(r), 0)) + ' a month</span></div>';
    if (!on.length) h += '<p class="muted" style="margin:0 2px 14px">All groups are turned off. Turn them back on in Settings.</p>';
    for (const f of on){
      const list = state.recurring.filter(r => r.freq === f).sort((a, b) => { const x = openOcc(a), y = openOcc(b); return x < y ? -1 : x > y ? 1 : 0; });
      h += '<div class="sub-head"><h3>' + FREQ_LABEL[f] + '</h3><span class="num muted">' + money(sum(list)) + REC_PER[f] + '</span></div>';
      h += '<section class="pc"><ul class="items">' + list.map(r => recRow(r, g)).join("") + '</ul>' +
        (list.length ? "" : '<p class="empty small">' + REC_EMPTY[f] + '</p>') + addRecForm(f, g) + '</section>';
    }

    // one-time expenses
    h += '<div class="sec-head"><h2>One-time expenses</h2></div>';

    const pays = [...state.payments].sort((a, b) => (a.due || "9999") < (b.due || "9999") ? -1 : 1);
    h += '<div class="sub-head"><h3>Things to pay</h3><span class="num muted">' + money(sum(pays)) + '</span></div>';
    h += pays.map(i => {
      const days = i.due ? daysUntil(i.due) : null, red = days !== null && days <= redDays();
      return '<div class="xcard' + (red ? " is-red" : "") + '">' +
        '<button class="xbtn" data-act="xPay" data-id="' + i.id + '" aria-label="Erase ' + esc(i.name) + '">' + XSVG + '</button>' +
        '<button class="item-main" data-act="editPay" data-id="' + i.id + '"><span class="item-name">' + esc(i.name) +
        '<span class="due' + (red ? " bad" : "") + '">' + (i.due ? dueText(days, i.due) : "no due date") + '</span></span>' +
        '<span class="num">' + money(i.amount) + '</span></button>' +
        assignHtml(i.id, suggestPaycheck(i.due, g.upcoming), "assign", g) + '</div>';
    }).join("");
    h += '<div class="addcard"><form class="add add-wrap" data-form="addPay">' +
      '<input name="name" placeholder="Something to pay" aria-label="Payment name" autocomplete="off" required style="flex-basis:100%">' +
      '<input name="amount" inputmode="decimal" placeholder="$0" aria-label="Amount" autocomplete="off" required>' +
      '<input name="due" type="date" aria-label="Due date">' +
      '<button type="submit">Add</button></form></div>';

    const buys = state.wishlist.filter(w => !w.done).sort((a, b) => (a.target || "9999") < (b.target || "9999") ? -1 : (a.target || "9999") > (b.target || "9999") ? 1 : 0);
    const perWeek = buys.reduce((a, w) => a + wishPerCheck(w), 0), next = g.upcoming[0];
    h += '<div class="sub-head"><h3>Things to buy</h3><span class="num muted">' + money(buys.reduce((a, w) => a + w.cost, 0)) + '</span></div>';
    if (perWeek > 0){
      h += '<div class="buy-sum"><span>Set aside <strong class="num">' + money(perWeek) + '</strong> ' + (weeklyPay() ? "a week" : "each paycheck") + ' to buy the dated items on time.</span>' +
        (next ? '<button data-act="fundGoals">Add to ' + dayLabel(next.date) + '</button>' : "") + '</div>';
    }
    h += buys.map(w => {
      const pw = wishPerCheck(w);
      let sub = w.target ? "by " + monthLabel(w.target) : "";
      if (w.saved) sub += (sub ? ", " : "") + money(w.saved) + " saved";
      return '<div class="xcard">' +
        '<button class="xbtn" data-act="xWish" data-id="' + w.id + '" aria-label="Erase ' + esc(w.name) + '">' + XSVG + '</button>' +
        '<button class="item-main" data-act="editWish" data-id="' + w.id + '"><span class="item-name">' + esc(w.name) +
        (sub ? '<span class="due">' + sub + '</span>' : "") + '</span>' +
        '<span class="amt-col"><span class="num">' + (w.cost ? money(w.cost) : "no price") + '</span>' +
        (pw ? '<span class="pw num">' + money(pw) + (weeklyPay() ? '/wk' : '/check') + '</span>' : "") + '</span></button></div>';
    }).join("");
    h += '<div class="addcard"><form class="add" data-form="addWish"><input name="name" placeholder="Something to buy" aria-label="Item" autocomplete="off" required>' +
      '<input name="cost" inputmode="decimal" placeholder="$0" aria-label="Price" autocomplete="off"><button type="submit">Add</button></form></div>';
    return h;
  }

  // ---------- sheet (edit dialogs) ----------
  const sheet = $("#sheet");
  let sheetCfg = null, deleteArmed = false;
  function fieldDiv(label, html){ return '<div class="field"><span>' + label + '</span>' + html + '</div>'; }
  function field(label, html){ return '<label class="field"><span>' + label + '</span>' + html + '</label>'; }
  function openSheet(cfg){
    sheetCfg = cfg; deleteArmed = false;
    const title = $("#sheetTitle");
    title.textContent = cfg.title;
    $("#sheetBody").innerHTML = cfg.body;
    const del = $("#sheetDelete");
    del.hidden = !cfg.onDelete; del.textContent = "Delete";
    $("#sheetSave").hidden = !!cfg.noSave; $("#sheetSave").textContent = cfg.saveText || "Save";
    $("#sheetCancel").textContent = cfg.cancelText || (cfg.back ? "Back" : "Cancel");
    if (!sheet.open){ if (typeof sheet.showModal === "function") sheet.showModal(); else sheet.setAttribute("open", ""); }
    sheet.scrollTop = 0;
    // keep the keyboard and date pickers closed until a field is tapped
    const a = document.activeElement;
    if (a && a !== title && a.matches && a.matches("input,select,textarea")) a.blur();
    const want = cfg.focus && $("#sheetForm").elements[cfg.focus];
    if (want) want.focus(); else title.focus({preventScroll: true});
  }
  function closeSheet(){ sheetCfg = null; catPending = null; if (sheet.open) sheet.close(); }
  let toastTimer = null, undoFn = null;
  function toast(msg, undo){
    $("#toastMsg").textContent = msg; undoFn = undo; $("#toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("#toast").hidden = true; undoFn = null; }, 5000);
  }
  $("#toastUndo").addEventListener("click", () => { if (undoFn){ undoFn(); undoFn = null; commit(); } $("#toast").hidden = true; });
  $("#sheetCancel").addEventListener("click", () => { if (sheetCfg && sheetCfg.back) sheetCfg.back(); else closeSheet(); });
  $("#sheetDelete").addEventListener("click", e => {
    if (!sheetCfg || !sheetCfg.onDelete) return;
    if (!deleteArmed){ deleteArmed = true; e.currentTarget.textContent = "Tap again to delete"; return; }
    sheetCfg.onDelete(); closeSheet(); commit();
  });
  $("#sheetForm").addEventListener("input", () => { if (sheetCfg && sheetCfg.onInput) sheetCfg.onInput(); });
  $("#sheetForm").addEventListener("change", () => { if (sheetCfg && sheetCfg.onInput) sheetCfg.onInput(); });
  $("#sheetBody").addEventListener("click", e => {
    const b = e.target.closest("[data-step]"); if (!b) return;
    const inp = $("#sheetForm").elements[b.dataset.step]; if (!inp) return;
    inp.value = Math.round(Math.max(0, pos(inp.value) + parseFloat(b.dataset.d)) * 100) / 100;
    if (sheetCfg && sheetCfg.onInput) sheetCfg.onInput();
  });
  $("#sheetForm").addEventListener("submit", e => {
    e.preventDefault();
    if (!sheetCfg) return;
    const back = sheetCfg.back;
    const ok = sheetCfg.onSave(new FormData(e.currentTarget));
    if (ok === false) return;
    if (back) back(); else closeSheet();
    commit();
  });

  function moveOptions(currentPcId){
    const g = groups();
    const list = [...g.upcoming];
    const cur = findPc(currentPcId);
    if (cur && !list.includes(cur)) list.unshift(cur);
    return list.map(p => '<option value="' + p.id + '"' + (p.id === currentPcId ? " selected" : "") + '>' + dayLabel(p.date) + ' check</option>').join("") +
      '<option value="__none"' + (!currentPcId ? " selected" : "") + '>Take it off the paycheck</option>';
  }

  function editItem(pcId, id){
    const pc = findPc(pcId); if (!pc) return;
    const it = pc.items.find(i => i.id === id); if (!it) return;
    openSheet({
      title: "Edit item",
      body: field("Name", '<input name="name" required value="' + esc(it.name) + '">') +
            field("Amount", '<input name="amount" inputmode="decimal" value="' + it.amount + '">') + catField(it.cat) +
            field("Due date (optional)", '<input name="due" type="date" value="' + esc(it.due) + '">') +
            field("Paid from", '<select name="move">' + moveOptions(pcId) + '</select>'),
      onSave: fd => {
        it.name = String(fd.get("name") || "").trim() || it.name;
        it.amount = toNum(fd.get("amount"));
        it.cat = catFrom(fd, it.cat);
        it.due = String(fd.get("due") || "");
        const dest = fd.get("move");
        if (dest && dest !== pcId){
          pc.items = pc.items.filter(i => i !== it);
          if (dest === "__none"){ if (it.recId) skipOcc(it); else { it.paid = false; state.payments.push(it); } }
          else { const to = findPc(dest); if (to) to.items.push(it); }
        }
      },
      onDelete: () => { skipOcc(it); pc.items = pc.items.filter(i => i.id !== id); }
    });
  }
  function editRec(id){
    const r = recById(id); if (!r) return;
    const o = openOcc(r);
    const opt = (v, l, cur) => '<option value="' + v + '"' + (v === cur ? " selected" : "") + '>' + l + '</option>';
    openSheet({
      title: "Edit recurring bill",
      body: field("Name", '<input name="name" required value="' + esc(r.name) + '">') +
            field("Amount", '<input name="amount" inputmode="decimal" value="' + r.amount + '">') + catField(r.cat) +
            field("How often", '<select name="freq">' + FREQS.map(f => opt(f, FREQ_TEXT[f], r.freq)).join("") + '</select>') +
            '<div id="rfDay">' + field("Due day of the month (blank if it changes)", '<input name="day" type="number" inputmode="numeric" min="1" max="31" value="' + (r.day || "") + '">') + '</div>' +
            '<div id="rfDate">' + field("Next due date", '<input name="due" type="date" value="' + (r.freq === "monthly" ? "" : o) + '">') + '</div>' +
            '<label class="check-field"><input type="checkbox" name="auto"' + (r.auto ? " checked" : "") + '> Add it to paychecks automatically</label>' +
            '<div id="rfWeek">' + field("Which paycheck", '<select name="autoWeek">' + opt("", "The last one before it's due", r.autoWeek) +
              whichOpts(r.autoWeek).map(o => opt(o[0], o[1], r.autoWeek)).join("") + '</select>') + '</div>' +
            '<p class="hint" id="rfHint"></p>',
      onInput: () => {
        const f = $("#sheetForm").elements, fr = f.freq.value, au = f.auto.checked;
        $("#rfDay").hidden = fr !== "monthly"; $("#rfDate").hidden = fr === "monthly";
        $("#rfWeek").hidden = !(au && fr === "monthly");
        if (fr !== "monthly" && !f.due.value) f.due.value = r.freq === "monthly" ? o : iso(today());
        $("#rfHint").textContent = !au ? "You'll put it on a paycheck yourself, here or from the paycheck's suggestions." :
          fr === "weekly" ? "It goes on every paycheck." :
          fr === "biweekly" ? "It goes on every other paycheck: the last one before each due date." :
          fr === "yearly" ? "It goes on the last paycheck before it's due." :
          (f.autoWeek.value ? "It goes on the paycheck you pick, for the next due date after that payday." : "It goes on the last paycheck before each due date.");
      },
      onSave: fd => {
        const before = {freq: r.freq, day: r.day, anchor: r.anchor, amount: r.amount, name: r.name, cat: r.cat};
        r.cat = catFrom(fd, r.cat);
        if (r.cat !== before.cat) for (const p of state.paychecks) for (const it of p.items) if (it.recId === r.id && (!it.cat || it.cat === before.cat)) it.cat = r.cat;
        r.name = String(fd.get("name") || "").trim() || r.name;
        r.amount = toNum(fd.get("amount"));
        r.freq = FREQS.includes(fd.get("freq")) ? fd.get("freq") : r.freq;
        if (r.freq === "monthly") r.day = Math.max(0, Math.min(31, Math.round(toNum(fd.get("day")))));
        else r.anchor = String(fd.get("due") || "") || r.anchor || iso(today());
        r.auto = !!fd.get("auto");
        r.autoWeek = AUTO_WEEKS.includes(fd.get("autoWeek")) ? fd.get("autoWeek") : "";
        if (before.freq !== r.freq || before.day !== r.day || before.anchor !== r.anchor) remapRec(r);
        // keep unpaid items on paychecks in step with the bill
        for (const p of state.paychecks) for (const it of p.items) if (it.recId === r.id && !it.paid){
          if (it.amount === before.amount) it.amount = r.amount;
          if (it.name === before.name) it.name = r.name;
        }
        autoFill();
      },
      onDelete: () => {
        state.recurring = state.recurring.filter(x => x.id !== id);
        for (const p of state.paychecks) for (const it of p.items) if (it.recId === id){ delete it.recId; delete it.recFor; }
      }
    });
    sheetCfg.onInput();
  }
  function whichOpts(cur){
    const pf = state.settings.payFreq;
    const list = pf === "weekly" ? [["1", "1st paycheck of the month (1st–7th)"], ["2", "2nd paycheck (8th–14th)"], ["3", "3rd paycheck (15th–21st)"], ["4", "4th paycheck (22nd–28th)"], ["last", "Last paycheck of the month"]]
      : pf === "biweekly" ? [["1", "1st paycheck of the month"], ["2", "2nd paycheck of the month"], ["last", "Last paycheck of the month"]]
      : pf === "semimonthly" ? [["1", "1st paycheck of the month"], ["last", "2nd paycheck of the month"]]
      : [["1", "The paycheck in the month it's due"]];
    if (cur && !list.some(o => o[0] === cur)) list.push([cur, cur === "last" ? "Last paycheck of the month" : "Paycheck " + cur + " of the month"]);
    return list;
  }
  // after a bill's schedule changes, move its links and "paid" marker to the matching new due dates
  function remapRec(r){
    const map = s => s ? nearestOcc(r, s) : s;
    for (const p of state.paychecks) for (const it of p.items) if (it.recId === r.id){ it.recFor = map(it.recFor); if (it.due) it.due = noDay(r) ? "" : it.recFor; }
    r.paidThrough = map(r.paidThrough);
    r.skip = r.skip.map(map);
  }
  function editPay(id){
    const it = state.payments.find(i => i.id === id); if (!it) return;
    openSheet({
      title: "Edit payment",
      body: field("Name", '<input name="name" required value="' + esc(it.name) + '">') +
            field("Amount", '<input name="amount" inputmode="decimal" value="' + it.amount + '">') + catField(it.cat) +
            field("Due date", '<input name="due" type="date" value="' + esc(it.due) + '">'),
      onSave: fd => { it.name = String(fd.get("name") || "").trim() || it.name; it.amount = toNum(fd.get("amount")); it.cat = catFrom(fd, it.cat); it.due = String(fd.get("due") || ""); },
      onDelete: () => { state.payments = state.payments.filter(i => i.id !== id); }
    });
  }
  function radios(name, opts, cur){
    return '<div class="radios" role="radiogroup">' + opts.map(([v, l]) =>

  function newPc(){
    const sorted = [...state.paychecks].sort((a, b) => a.date < b.date ? -1 : 1);

    pcSheet("Add a paycheck", draft,

      (fd, d, hours, amount) => {
